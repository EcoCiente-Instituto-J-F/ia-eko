name: Publicar imagem Docker IA Eko

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao sem prefixo (exemplo 1.0.2)"
        required: true
        default: "1.0.2"
        type: string

permissions:
  contents: read

concurrency:
  group: publish-ia-eko
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar imagem imutavel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Validar tag e Secrets
        id: image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Versao invalida. Use MAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Configure DOCKERHUB_USERNAME e DOCKERHUB_TOKEN no repositorio ou nos Secrets da organizacao."
            exit 1
          fi
          IMAGE="ecociente/ecociente:ia-eko-$VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Imagem candidata: $IMAGE"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Proteger tag publicada
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::Imagem ja publicada e imutavel: $IMAGE"
            exit 1
          fi
          if echo "$OUTPUT" | grep -Eqi 'not found|manifest unknown|no such manifest'; then
            echo "Tag disponivel: $IMAGE"
            exit 0
          fi
          echo "::error::Nao foi possivel verificar a tag no Docker Hub."
          exit 1

      - name: Publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.image }}

      - name: Resultado
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "Imagem publicada: $IMAGE"
