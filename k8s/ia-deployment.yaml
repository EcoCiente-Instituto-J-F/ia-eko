apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-eko
  namespace: ecociente
  labels:
    app: ia-eko
    app.kubernetes.io/name: ia-eko
    app.kubernetes.io/part-of: ecociente

spec:
  replicas: 1

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ia-eko

  template:
    metadata:
      labels:
        app: ia-eko
        app.kubernetes.io/name: ia-eko
        app.kubernetes.io/part-of: ecociente

    spec:
      containers:
        - name: ia-eko
          image: ecociente/ecociente:ia-eko-1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: ia-eko-config

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

      terminationGracePeriodSeconds: 30