# Coleta as métricas expostas pela API em /metrics (src/observability/metrics.py).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecociente-ia
    metrics_path: /metrics
    static_configs:
      # Nome do serviço no docker-compose.yml. Para a API rodando fora do Docker,
      # troque por host.docker.internal:8000.
      - targets: ["api:8000"]
        labels:
          app: ecociente-ia
